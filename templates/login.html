<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Ponto</title>
</head>
<body>
    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        <label>Usuário:</label><br>
        {{ form.username }}

        <br><br>

        <label>Senha:</label><br>
        {{ form.password }}

        <br><br>

        <button type="submit">Entrar</button>
    </form>

    <div class="text-center mt-3">

        <a href="/cadastro/">
            Criar meu cadastro
        </a>

    </div>

</body>
</html>
