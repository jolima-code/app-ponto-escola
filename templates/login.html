{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Login - Escola Cultivar
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    145deg,
                #edf4ff 0%,
                #d8e9ff 50%,
                #f7f9fc 100%
            );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .login-card {

            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 32px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.12);
        }

        .logo {

            width: 120px;
        }

        .title {

            font-size: 3rem;

            font-weight: 800;

            color: #0d1b52;
        }

        .subtitle {

            color: #667085;

            font-size: 1.1rem;
        }

        .form-label {

            font-weight: 600;

            color: #344054;
        }

        .form-control {

            height: 60px;

            border-radius: 18px;

            font-size: 1.05rem;

            padding-left: 18px;

            border: 1px solid #d0d5dd;
        }

        .form-control:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 0.2rem rgba(13,110,253,.15);
        }

        .btn-login {

            height: 58px;

            border-radius: 18px;

            font-size: 1.1rem;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #0056d6
                );

            border: none;
        }

        .btn-login:hover {

            opacity: .95;
        }

        .register-box {

            background: #f8fbff;

            border: 1px solid #dbe8ff;

            border-radius: 20px;

            padding: 20px;
        }

        .register-link {

            text-decoration: none;

            font-weight: 700;

            font-size: 1.1rem;
        }

        @media (max-width: 576px) {

            .login-card {

                padding: 28px;
            }

            .title {

                font-size: 2.2rem;
            }
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <img
            src="{% static 'img/logo.png' %}"
            class="logo mb-3"
            alt="Logo">

        <h1 class="title">
            Login
        </h1>

        <p class="subtitle">

            Bem-vindo(a)! Faça login para acessar o sistema.

        </p>

    </div>

    {% if form.errors %}

        <div class="alert alert-danger rounded-4 text-center">

            Usuário ou senha inválidos.

        </div>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">

                Usuário

            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Digite seu usuário"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Senha

            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Digite sua senha"
                required>

        </div>

        <div class="d-grid mb-4">

            <button
                type="submit"
                class="btn btn-primary btn-login">

                Entrar

            </button>

        </div>

    </form>

    <div class="text-center text-muted mb-3">

        ou

    </div>

    <div class="register-box text-center">

        <p class="mb-2 text-muted">

            Ainda não tem uma conta?

        </p>

        <a
            href="/cadastro/"
            class="register-link">

            Criar meu cadastro

        </a>

    </div>

    <div class="text-center mt-4 text-muted small">

        © 2026 Escola Cultivar

    </div>

</div>

</body>

</html>
