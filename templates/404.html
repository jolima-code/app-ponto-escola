{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Página não encontrada
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .error-card {

            background: rgba(255,255,255,0.06);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 32px;

            padding: 50px;

            text-align: center;

            max-width: 520px;

            width: 100%;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.4);
        }

        .logo-container {

            width: 140px;

            height: 140px;

            margin: 0 auto 30px auto;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff9f43,
                    #ff7b00
                );

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 15px 35px rgba(255,123,0,0.35);
        }

        .logo {

            width: 85px;
        }

        h1 {

            color: white;

            font-weight: 800;

            margin-bottom: 20px;
        }

        p {

            color: #cbd5e1;

            font-size: 1.05rem;
        }

        .btn-home {

            margin-top: 25px;

            border-radius: 18px;

            padding: 14px 30px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #2563eb
                );

            border: none;
        }

    </style>

</head>

<body>

<div class="error-card">

    <div class="logo-container">

        <img
            src="{% static 'img/logo.png' %}"
            class="logo"
            alt="Logo">

    </div>

    <h1>
        Página não encontrada
    </h1>

    <p>
        O endereço acessado não existe ou foi movido.
    </p>

    <a
        href="/"
        class="btn btn-primary btn-home">

        Voltar ao sistema

    </a>

</div>

</body>

</html>
