{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Erro interno - Escola Cultivar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow p-5 text-center" style="max-width: 520px; border-radius: 24px;">

        <img
            src="{% static 'img/logo.png' %}"
            alt="Logo"
            style="width: 90px;"
            class="mx-auto mb-4">

        <h1 class="fw-bold text-danger">
            Algo deu errado
        </h1>

        <p class="text-muted">
            O sistema encontrou um erro inesperado. Tente novamente em alguns instantes.
        </p>

        <a href="/" class="btn btn-danger rounded-pill mt-3">
            Voltar ao sistema
        </a>

    </div>

</div>

</body>
</html>
