{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Solicitar Compensação - Escola Cultivar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="/">

            <img
                src="{% static 'img/logo.png' %}"
                alt="Logo"
                width="40"
                class="me-2">

            Escola Cultivar

        </a>

        <div>
            <a href="/" class="btn btn-outline-light me-2">Ponto</a>
            <a href="/banco-horas/" class="btn btn-outline-light me-2">Banco de Horas</a>
            <a href="/documentos/" class="btn btn-outline-light me-2">Documentos</a>
        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Solicitar Compensação de Horas</h3>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Data</label>
                    <input
                        type="date"
                        name="data"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Tipo</label>
                    <select
                        name="tipo"
                        class="form-select"
                        required>

                        <option value="credito">
                            Crédito
                        </option>

                        <option value="debito">
                            Débito
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Quantidade de horas</label>
                    <input
                        type="time"
                        name="quantidade"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Motivo</label>
                    <textarea
                        name="motivo"
                        class="form-control"
                        rows="4"
                        required></textarea>
                </div>

                <button class="btn btn-success">
                    Enviar Solicitação
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
