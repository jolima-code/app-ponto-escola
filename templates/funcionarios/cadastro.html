{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Cadastro - Escola Cultivar
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="/">

            <img
                src="{% static 'img/logo.png' %}"
                alt="Logo"
                width="40"
                class="me-2">

            Escola Cultivar

        </a>

    </div>

</nav>

{% if messages %}

<div class="container mt-3">

    {% for message in messages %}

        <div class="alert alert-{{ message.tags }} text-center">

            {{ message }}

        </div>

    {% endfor %}

</div>

{% endif %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>
                        Cadastro de Colaborador
                    </h3>

                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Nome completo
                            </label>

                            <input
                                type="text"
                                name="nome"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                name="senha"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirmar senha
                            </label>

                            <input
                                type="password"
                                name="confirmar_senha"
                                class="form-control"
                                required>

                        </div>

                        <button class="btn btn-success w-100">

                            Criar cadastro

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a href="/login/">
                            Já tenho cadastro
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
